name: Build native extension

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - "vendor/WDL/**"
      - "vendor/reaper-sdk/**"
      - ".github/workflows/build-extension.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C native OS=Linux clean all
      - uses: actions/upload-artifact@v4
        with:
          name: linux64
          path: dist/linux64/

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C native OS=Darwin clean all
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: dist/darwin-arm64/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (MSVC)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64'
          New-Item -ItemType Directory -Force -Path dist\win64 | Out-Null
          cl /nologo /O2 /LD /EHsc /D_WIN32 /I vendor\reaper-sdk native\reaper_reaprofessor.cpp /Fe:dist\win64\reaper_reaprofessor64.dll /link /DLL user32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: dist/win64/
